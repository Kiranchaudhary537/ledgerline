name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Same major as docker-compose.yml.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: acme
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acme" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Local defaults match the postgres service above.
      - run: cp .env.example .env
      # kysely-codegen --verify in `pnpm check` reads the migrated dev database.
      - run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Seed the dev database for the benchmark
        run: pnpm db:seed
        env:
          SEED_ADMIN_PASSWORD: ci-password-long-enough
      - run: pnpm bench
